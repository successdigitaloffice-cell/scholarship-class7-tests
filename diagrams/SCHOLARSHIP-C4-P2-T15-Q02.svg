<svg width="220" height="70" viewBox="0 0 220 70" xmlns="http://www.w3.org/2000/svg">
    <!-- Option A: Triangle -->
    <g transform="translate(15, 10)">
      <polygon points="20,5 5,45 35,45" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="20" y="58" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">(A)</text>
    </g>
    <!-- Option B: Square -->
    <g transform="translate(68, 10)">
      <rect x="5" y="8" width="34" height="34" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="22" y="58" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">(B)</text>
    </g>
    <!-- Option C: Pentagon -->
    <g transform="translate(120, 10)">
      <polygon points="20,5 5,18 10,43 30,43 35,18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="20" y="58" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">(C)</text>
    </g>
    <!-- Option D: Circle -->
    <g transform="translate(172, 10)">
      <circle cx="20" cy="25" r="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
      <text x="20" y="58" font-size="10" font-weight="bold" text-anchor="middle" fill="#b91c1c">(D)</text>
    </g>
